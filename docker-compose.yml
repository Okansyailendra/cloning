services:
  sound-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sound-lab-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data:ro
      - ./samples:/app/samples:ro
      - ./audio_alarm:/app/audio_alarm:ro